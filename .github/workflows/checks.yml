name: Checks

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  checks:
    name: Secret Scan & Public Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history for secrets with gitleaks
        run: bash scripts/check-secrets.sh

      - name: Check the files and history
        run: |
          bash scripts/check-public.sh
          bash scripts/check-public.sh --history

      - name: Check every translation has the English keys
        run: node scripts/check-locales.mjs

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Serve every page in the Workers runtime
        run: bash scripts/check-edge.sh

      - name: Check every config change has a changelog entry
        if: github.event_name == 'pull_request'
        run: bash scripts/check-changelog.sh "origin/${GITHUB_BASE_REF}..HEAD"
